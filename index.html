<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chem Study Hub</title>
  <meta name="description" content="A private study hub for CHEM 159: spaced-repetition quizzes, flashcards and your own uploaded notes, all kept in this browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Chem Hub">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234b5cf0'/%3E%3Ctext x='32' y='47' font-size='36' text-anchor='middle' fill='%23ffffff'%3E%E2%9A%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo">⚗</span> Chem Study Hub</a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="">Home</a>
      <a href="#/chapters" data-nav="chapters">Chapters</a>
      <a href="#/upload" data-nav="upload">Upload</a>
      <a href="#/quiz" data-nav="quiz">Quiz</a>
      <a href="#/cards" data-nav="cards">Flashcards</a>
      <a href="#/schedule" data-nav="schedule">Schedule</a>
      <a href="#/reference" data-nav="reference">Formulas</a>
      <a href="#/stats" data-nav="stats">Stats</a>
      <a href="#/settings" data-nav="settings">Look &amp; layout</a>
    </nav>
    <div class="tools">
      <form id="search-form" class="search" role="search">
        <input id="search-input" type="search" placeholder="Search notes…" aria-label="Search notes">
      </form>
      <button class="icon-btn edit-btn" data-act="edit-toggle" title="Edit the page: remove or add windows" aria-label="Edit the page layout" aria-pressed="false">⚗</button>
      <button class="icon-btn" data-act="theme" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="library.js"></script>
  <script src="app.js"></script>
</body>
</html>
